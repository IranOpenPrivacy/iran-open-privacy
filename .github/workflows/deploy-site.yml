name: deploy-site

# Rebuilds iranopenprivacy.org whenever the standard or docs change on main.
# Needs the repository secret VERCEL_DEPLOY_HOOK (a Vercel deploy hook URL for IranOpenPrivacy/website).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK not set, skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Deploy triggered"
