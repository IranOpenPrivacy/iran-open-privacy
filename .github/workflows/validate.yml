name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml jsonschema
      - name: Validate checklist, templates and company documents
        run: python scripts/validate.py
      - name: Check generated checklist tables are up to date
        run: python scripts/render_checklist.py --check
      - name: Check relative links
        run: python scripts/check_links.py
